<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    #messages {
      list-style-type: none;
      padding: 10px;
      height: 300px;
      overflow-y: scroll;
      margin-bottom: 20px;
      border: 1px solid #555;
      background: linear-gradient(90deg, #0d0e11, #00d4ff);
    }

    .message {
      max-width: 70%;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 15px;
      word-break: break-word;
      display: flex;
      flex-direction: column;
    }

    .message.self {
      align-self: flex-end;
      background-color: #007bff;
      color: white;
    }

    .message.other {
      align-self: flex-start;
      background-color: #333;
      color: cyan;
    }

    .username {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #ccc;
      margin-top: 2px;
      align-self: flex-end;
    }

    #privateBox {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #555;
      outline: none;
    }
  </style>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">
  <div id="chat-container" style="width: 100%; max-width: 600px; margin: 0 auto; background: #7ebfff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);">
    <h1 style="font-family: Arial, sans-serif; font-size: 36px; font-weight: bold; color: #007bff; text-align: center; padding: 20px 0; background: linear-gradient(90deg, #007bff, #00d4ff); -webkit-background-clip: text; color: transparent; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2); letter-spacing: 2px; text-transform: uppercase;">Indramani's Chatting App</h1>

    <div id="user-info">
      <span id="user-email"></span>
    </div>

    <ul id="messages"></ul>

    <!-- Private chat input -->
    <input id="privateBox" type="text" placeholder="Enter username to chat privately (optional)">

    <textarea id="messageInput" placeholder="Type a message..." disabled style="padding: 10px; margin: 5px 0; width: calc(100% - 22px); resize: none; height: 50px; background: linear-gradient(90deg, #3374d6, #00d4ff); color: #ff3333; border: 1px solid #555; border-radius: 5px; outline: none;"></textarea>

    <input id="sendMessage" type="button" value="Send" onclick="sendMessage()" disabled style="padding: 10px; margin: 5px 0; width: 18%; background-color: #007bff; color: white; border: none; cursor: pointer;">
    <input id="resetButton" type="button" value="Reset Chat" onclick="resetChat()" style="padding: 10px; margin: 5px 0; width: 18%; background-color: #dc3545; color: white; border: none; cursor: pointer;">
    <input id="logoutButton" type="button" value="Logout" onclick="logout()" style="padding: 10px; margin: 5px 0; width: 18%; background-color: #dc3545; color: white; border: none; cursor: pointer;">
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var userEmail = localStorage.getItem('userEmail');
    var username = userEmail ? userEmail.split('@')[0] : null;
    var socket;

    if (username) {
      socket = io({ query: { userName: userEmail } });
      document.getElementById('user-email').textContent = 'Logged in as: ' + username;
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendMessage').disabled = false;
      socket.emit('join chat');
    } else {
      window.location.href = "login.html";
    }

    socket.on('chat message', function(msg) {
      displayMessage(msg);
    });

    function displayMessage(msg) {
      const li = document.createElement('li');
      li.classList.add('message');

      const msgName = msg.username.split('@')[0]; // friendly name
      if (msgName === username) {
        li.classList.add('self'); // your message -> right
      } else {
        li.classList.add('other'); // others -> left
      }

      const usernameSpan = document.createElement('span');
      usernameSpan.classList.add('username');
      usernameSpan.textContent = msgName;

      const messageText = document.createElement('span');
      messageText.textContent = msg.message;

      const timeSpan = document.createElement('span');
      timeSpan.classList.add('timestamp');
      const date = new Date(msg.timestamp);
      const options = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
      timeSpan.textContent = date.toLocaleString('en-IN', options);

      li.appendChild(usernameSpan);
      li.appendChild(messageText);
      li.appendChild(timeSpan);

      document.getElementById('messages').appendChild(li);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function sendMessage() {
      const message = document.getElementById('messageInput').value.trim();
      const privateToInput = document.getElementById('privateBox');
      const privateTo = privateToInput ? privateToInput.value.trim() : null;

      if (message !== '') {
        socket.emit('chat message', {
          username: username,
          message: message,
          timestamp: new Date().toISOString(),
          privateTo: privateTo || null
        });
        document.getElementById('messageInput').value = '';
        if(privateToInput) privateToInput.value = '';
      }
    }

    function resetChat() {
      document.getElementById('messages').innerHTML = '';
    }

    function logout() {
      localStorage.removeItem('userEmail');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
