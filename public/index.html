<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat App</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
      margin: 0;
      padding: 20px;
    }

    #chat-container {
      max-width: 600px;
      margin: auto;
      background: linear-gradient(135deg, #1f1f2e 0%, #2c2c3e 100%);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.6s ease-in-out;
      color: #ffffff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages {
      list-style: none;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      background: #0d0e11;
      color: white;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .message {
      padding: 10px 15px;
      border-radius: 18px;
      max-width: 75%;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: popIn 0.3s ease-in-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .message.self {
      background: linear-gradient(135deg, #007bff, #00b4d8);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      background: linear-gradient(135deg, #333, #555);
      color: #00eaff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message small {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
      text-align: right;
    }

    #privateBox, #messageInput {
      width: calc(80% - 10px);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #aaa;
      outline: none;
      font-size: 14px;
      resize: none;
    }

    #connectBtn, #sendMessage, #logoutBtn, #resetBtn {
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease-in-out;
    }

    #connectBtn, #sendMessage {
      width: 18%;
      padding: 10px;
      font-weight: 600;
    }

    #connectBtn { background: #28a745; }
    #connectBtn:hover { background: #218838; }

    #sendMessage { background: #007bff; }
    #sendMessage:hover { background: #0056b3; }

    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    #top-bar h2 {
      margin: 0;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .top-buttons {
      display: flex;
      gap: 8px;
    }

    #logoutBtn, #resetBtn {
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 20px;
    }

    #resetBtn {
      background: linear-gradient(90deg, #6c757d, #868e96);
    }
    #resetBtn:hover {
      background: linear-gradient(90deg, #5a6268, #777);
      transform: scale(1.03);
    }

    #logoutBtn {
      background: linear-gradient(90deg, #dc3545, #ff4b5c);
    }
    #logoutBtn:hover {
      background: linear-gradient(90deg, #c82333, #e63946);
      transform: scale(1.03);
    }

    #typing-indicator {
      font-style: italic;
      color: white;
      margin: 6px 0 0 4px;
      font-size: 13px;
      height: 18px;
    }

    /* Private chat title above messages */
    #private-chat-title {
      color: #ffcc70;
      font-weight: 600;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="top-bar">
      <h2>Indramani’s Chat App</h2>
      <div class="top-buttons">
        <button id="resetBtn" onclick="resetChat()">Reset</button>
        <button id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </div>

    <p>Your ID: <strong id="myID">Loading...</strong></p>
    <p id="private-chat-title"></p>
    <ul id="messages"></ul>
    <p id="typing-indicator"></p>

    <div style="display:flex; margin:10px 0;">
      <input id="privateBox" placeholder="Enter user ID to chat privately" />
      <button id="connectBtn" onclick="connectPrivate()">Connect</button>
    </div>

    <textarea id="messageInput" placeholder="Type a message..." disabled></textarea>
    <button id="sendMessage" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const userEmail = localStorage.getItem('userEmail') || ('guest' + Math.floor(Math.random() * 1000));
    const socket = io({ query: { userName: userEmail } });
    let myID = null;
    let currentPrivateID = null;
    const messageInput = document.getElementById('messageInput');
    const typingIndicator = document.getElementById('typing-indicator');
    const privateChatTitle = document.getElementById('private-chat-title');

    socket.on('your id', data => {
      myID = data.id;
      document.getElementById('myID').textContent = myID;
      messageInput.disabled = false;
      document.getElementById('sendMessage').disabled = false;
    });

    function displayMessage(msg, isPrivate=false) {
      const list = document.getElementById('messages');
      if (!list) return;
      const li = document.createElement('li');
      li.className = 'message ' + (msg.username === userEmail.split('@')[0] ? 'self' : 'other');
      li.innerHTML = `${isPrivate ? '[Private] ' : ''}${msg.username}: ${msg.message}<small>${new Date(msg.timestamp || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</small>`;
      list.appendChild(li);
      list.scrollTop = list.scrollHeight;
    }

    socket.on('chat message', msg => displayMessage(msg, false));
    socket.on('private message', msg => {
      const otherID = msg.fromID === myID ? msg.toID : msg.fromID;
      currentPrivateID = otherID;
      privateChatTitle.textContent = `Private Chat with ${otherID}`;
      displayMessage(msg, true);
    });

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;
      socket.emit('chat message', { message: msg, privateTo: currentPrivateID || null });
      messageInput.value = '';
    }

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function connectPrivate() {
      const targetID = document.getElementById('privateBox').value.trim();
      if (!targetID) return alert('Enter a valid user ID');
      socket.emit('private request', { fromID: myID, toID: targetID });
      currentPrivateID = targetID;
      privateChatTitle.textContent = `Private Chat with ${targetID}`;
      alert('Private chat request sent to ID ' + targetID);
    }

    socket.on('private request', data => {
      const accept = confirm(`User ${data.fromID} wants to chat privately. Accept?`);
      if (accept) {
        socket.emit('private accept', { fromID: data.fromID });
        currentPrivateID = data.fromID;
        privateChatTitle.textContent = `Private Chat with ${data.fromID}`;
      } else {
        socket.emit('private decline', { fromID: data.fromID });
      }
    });

    socket.on('private accepted', data => {
      const otherID = data.user1 === myID ? data.user2 : data.user1;
      currentPrivateID = otherID;
      privateChatTitle.textContent = `Private Chat with ${otherID}`;
      alert('Private chat started with ID ' + otherID);
    });

    function resetChat() {
      if (confirm('Are you sure you want to clear chat messages?')) {
        document.getElementById('messages').innerHTML = '';
      }
    }

    function logout() {
      if (confirm('Do you want to logout?')) {
        localStorage.removeItem('userEmail');
        window.location.href = '/login.html';
      }
    }

    let typingTimeout;
    messageInput.addEventListener('input', () => {
      socket.emit('typing', { toID: currentPrivateID || null });
    });

    socket.on('typing', data => {
      const name = data.fromName || `User ${data.fromID}`;
      typingIndicator.textContent = `${name} is typing...`;
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => typingIndicator.textContent = '', 1500);
    });
  </script>
</body>
</html>
