<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f3; margin: 0; padding: 20px; }
    #chat-container { max-width: 600px; margin: auto; background: #7ebfff; padding: 20px; border-radius: 12px; }
    #messages, #private-messages { list-style: none; padding: 10px; height: 300px; overflow-y: scroll; background: #0d0e11; color: white; border-radius: 10px; }
    .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 70%; }
    .message.self { background-color: #007bff; color: white; align-self: flex-end; }
    .message.other { background-color: #333; color: cyan; align-self: flex-start; }
    #privateBox, #messageInput { width: calc(80% - 10px); padding: 10px; border-radius: 5px; border: 1px solid #555; }
    #connectBtn, #sendMessage, #logoutBtn, #resetBtn { width: 18%; padding: 10px; border: none; color: white; cursor: pointer; border-radius: 5px; }
    #connectBtn { background-color: #28a745; }
    #sendMessage { background-color: #007bff; }
    #logoutBtn { background-color: #dc3545; margin-left: 5px; }
    #resetBtn { background-color: #6c757d; margin-left: 5px; }
    #top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #private-chat-container { max-width: 600px; margin: 20px auto 0 auto; background: #ff9f43; padding: 20px; border-radius: 12px; display: none; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="top-bar">
      <h2>Indramani’s Chat App</h2>
      <div>
        <button id="resetBtn" onclick="resetChat()">Reset Chat</button>
        <button id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </div>
    <p>Your ID: <strong id="myID">Loading...</strong></p>
    <ul id="messages"></ul>
    <div style="display:flex; margin-bottom: 10px;">
      <input id="privateBox" placeholder="Enter user ID to chat privately">
      <button id="connectBtn" onclick="connectPrivate()">Connect</button>
    </div>
    <textarea id="messageInput" placeholder="Type a message..." disabled></textarea>
    <button id="sendMessage" onclick="sendMessage()" disabled>Send</button>
  </div>

  <!-- Single private chat box -->
  <div id="private-chat-container">
    <h3 id="private-chat-title">Private Chat</h3>
    <ul id="private-messages" class="private-chat"></ul>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const userEmail = localStorage.getItem('userEmail') || ('guest' + Math.floor(Math.random() * 1000));
    const socket = io({ query: { userName: userEmail } });
    let myID = null;
    let currentPrivateID = null; // store which user we are chatting privately with

    socket.on('your id', data => {
      myID = data.id;
      document.getElementById('myID').textContent = myID;
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendMessage').disabled = false;
    });

    socket.on('chat message', msg => displayMessage(msg, false));
    socket.on('private message', msg => {
      const otherID = msg.fromID === myID ? msg.toID : msg.fromID;
      openPrivateChat(otherID);
      displayMessage(msg, true);
    });

    function displayMessage(msg, isPrivate) {
      const list = isPrivate ? document.getElementById('private-messages') : document.getElementById('messages');
      if (!list) return;

      const li = document.createElement('li');
      li.className = 'message ' + (msg.username === userEmail.split('@')[0] ? 'self' : 'other');
      li.textContent = `${msg.username}: ${msg.message}`;
      list.appendChild(li);
      list.scrollTop = list.scrollHeight;
    }

    function sendMessage() {
      const msg = document.getElementById('messageInput').value.trim();
      const privateTo = currentPrivateID; // send to current private chat user if any
      if (!msg) return;

      socket.emit('chat message', { message: msg, privateTo: privateTo || null });
      document.getElementById('messageInput').value = '';
    }

    function connectPrivate() {
      const targetID = document.getElementById('privateBox').value.trim();
      if (!targetID) return alert('Enter a valid user ID');
      socket.emit('private request', { fromID: myID, toID: targetID });
      openPrivateChat(targetID);
      alert('Private chat request sent to ID ' + targetID);
    }

    socket.on('private request', data => {
      const accept = confirm(`User ${data.fromID} wants to chat privately. Accept?`);
      if (accept) {
        socket.emit('private accept', { fromID: data.fromID });
        openPrivateChat(data.fromID);
      } else {
        socket.emit('private decline', { fromID: data.fromID });
      }
    });

    socket.on('private accepted', data => {
      const otherID = data.user1 === myID ? data.user2 : data.user1;
      openPrivateChat(otherID);
      alert('Private chat started with ID ' + otherID);
    });

    function openPrivateChat(otherID) {
      currentPrivateID = otherID;
      document.getElementById('private-chat-title').textContent = `Private Chat with ${otherID}`;
      document.getElementById('private-chat-container').style.display = 'block';
      document.getElementById('private-messages').innerHTML = '';
    }

    // Reset Chat
    function resetChat() {
      if (confirm('Are you sure you want to clear chat messages?')) {
        document.getElementById('messages').innerHTML = '';
        document.getElementById('private-messages').innerHTML = '';
      }
    }

    // Logout
    function logout() {
      if (confirm('Do you want to logout?')) {
        localStorage.removeItem('userEmail');
        window.location.href = '/login.html';
      }
    }
  </script>
</body>
</html>
