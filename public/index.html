<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">
  <div id="chat-container" style="width: 100%; max-width: 600px; margin: 0 auto; background: #7ebfff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);">
    <h1 id="chatapp" style="font-family: Arial, sans-serif; font-size: 36px; font-weight: bold; color: #007bff; text-align: center; padding: 20px 0; background: linear-gradient(90deg, #007bff, #00d4ff); -webkit-background-clip: text; color: transparent; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2); letter-spacing: 2px; text-transform: uppercase;">Indramani's Chatting App</h1>

    <div id="user-info">
      <span id="user-email"></span> <!-- Display the logged-in user's email here -->
    </div>

    <ul id="messages" style="list-style-type: none; padding: 0; height: 300px; overflow-y: scroll; margin-bottom: 20px; border: 1px solid #555; padding: 10px; background: linear-gradient(90deg, #0d0e11, #00d4ff); color: #f4f4f4;"></ul>

    <textarea id="messageInput" placeholder="Type a message..." disabled style="padding: 10px; margin: 5px 0; width: calc(100% - 22px); resize: none; height: 50px; background: linear-gradient(90deg, #3374d6, #00d4ff); color: #ff3333; border: 1px solid #555; border-radius: 5px; outline: none;"></textarea>

    <input id="sendMessage" type="button" value="Send" onclick="sendMessage()" disabled style="padding: 10px; margin: 5px 0; width: 18%; background-color: #007bff; color: white; border: none; cursor: pointer;">
    <input id="resetButton" type="button" value="Reset Chat" onclick="resetChat()" style="padding: 10px; margin: 5px 0; width: 18%; background-color: #dc3545; color: white; border: none; cursor: pointer;">
    
    <!-- Logout Button -->
    <input id="logoutButton" type="button" value="Logout" onclick="logout()" style="padding: 10px; margin: 5px 0; width: 18%; background-color: #dc3545; color: white; border: none; cursor: pointer;">
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket = io();
    var username = '';

    // Get the user email from localStorage
    username = localStorage.getItem('userEmail');
    if (username) {
      document.getElementById('user-email').textContent = 'Logged in as: ' + username;
      
      // Enable message input and send button if the user is logged in
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendMessage').disabled = false;
      
      // Notify the server that the user has joined
      socket.emit('join chat');
    } else {
      window.location.href = "login.html"; // Redirect to login if no user is logged in
    }

    // Listen for incoming chat messages from the server
    socket.on('chat message', function (msg) {
      displayMessage(msg);
    });

    function displayMessage(msg) {
      var li = document.createElement('li');
      var usernameSpan = document.createElement('span');
      usernameSpan.textContent = msg.username + ': ';
      usernameSpan.style.fontWeight = 'bold';
      usernameSpan.style.color = 'cyan';

      var messageText = document.createTextNode(msg.message + ' ');
      var timeSpan = document.createElement('span');
      timeSpan.style.fontSize = '12px';
      timeSpan.style.color = '#ddd';

      const date = new Date(msg.timestamp);
      const options = {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      };
      const formattedTime = date.toLocaleString('en-IN', options);

      timeSpan.textContent = `(${formattedTime})`;

      li.appendChild(usernameSpan);
      li.appendChild(messageText);
      li.appendChild(timeSpan);

      document.getElementById('messages').appendChild(li);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function sendMessage() {
      var message = document.getElementById('messageInput').value.trim();
      if (message !== '') {
        var fullMessage = username + ': ' + message;
        socket.emit('chat message', fullMessage);
        document.getElementById('messageInput').value = '';
      }
    }

    function resetChat() {
      document.getElementById('messages').innerHTML = '';
    }

    // Logout functionality
    function logout() {
      localStorage.removeItem('userEmail');
      window.location.href = 'login.html'; // Redirect to login page
    }
  </script>
</body>
</html>
